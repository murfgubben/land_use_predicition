<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Satellite Land Cover Classifier</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #e8f0f3;
      --muted: #9eafb7;
      --surface: #18252d;
      --page: #0b131a;
      --line: #2b3d47;
      --accent: #55c7a0;
      --accent-dark: #319a78;
      --accent-soft: #193d3b;
      --danger: #ff8d8d;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-width: 320px;
      color: var(--ink);
      background:
        radial-gradient(circle at 85% 0%, rgb(44 91 102 / 0.28), transparent 32%),
        linear-gradient(145deg, #14232d 0%, var(--page) 58%, #091016 100%);
    }

    main {
      width: min(920px, calc(100% - 32px));
      margin: 0 auto;
      padding: 48px 0 64px;
    }

    header {
      margin-bottom: 28px;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 0.76rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1, h2, p {
      margin-top: 0;
    }

    h1 {
      max-width: 620px;
      margin-bottom: 12px;
      font-size: clamp(2rem, 5vw, 3.5rem);
      line-height: 1.05;
      letter-spacing: -0.04em;
    }

    .intro {
      max-width: 600px;
      margin-bottom: 0;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.6;
    }

    .card {
      padding: clamp(20px, 4vw, 34px);
      border: 1px solid var(--line);
      border-radius: 20px;
      background: rgb(24 37 45 / 0.94);
      box-shadow: 0 18px 50px rgb(0 0 0 / 0.28);
    }

    .drop-zone {
      display: grid;
      min-height: 190px;
      place-items: center;
      padding: 28px;
      border: 2px dashed #45616a;
      border-radius: 14px;
      background: rgb(11 19 26 / 0.72);
      text-align: center;
      cursor: pointer;
      transition: border-color 150ms ease, background 150ms ease;
    }

    .drop-zone:hover,
    .drop-zone.is-dragging {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .drop-zone strong {
      display: block;
      margin-bottom: 8px;
      font-size: 1.1rem;
    }

    .drop-zone span {
      color: var(--muted);
      font-size: 0.9rem;
    }

    #file-input {
      display: none;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(180px, 0.8fr) minmax(0, 1.2fr);
      gap: 28px;
      align-items: start;
      margin-top: 24px;
    }

    .preview-wrap {
      display: none;
    }

    .preview-wrap.is-visible {
      display: block;
    }

    .preview-wrap h2,
    .results h2 {
      margin-bottom: 12px;
      font-size: 1.05rem;
    }

    #preview {
      display: block;
      width: 100%;
      max-height: 260px;
      border-radius: 12px;
      object-fit: cover;
      background: #22323b;
    }

    .file-name {
      overflow: hidden;
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 0.88rem;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .action {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-top: 24px;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 22px;
      color: #fff;
      background: var(--accent);
      font: inherit;
      font-weight: 750;
      cursor: pointer;
      transition: background 150ms ease, transform 150ms ease;
    }

    button:hover:not(:disabled) {
      background: var(--accent-dark);
      transform: translateY(-1px);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    #status {
      min-height: 1.4em;
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    #status.error {
      color: var(--danger);
      font-weight: 650;
    }

    .results {
      display: none;
      margin-top: 28px;
    }

    .results.is-visible {
      display: block;
    }

    .prediction {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 24px;
      padding: 18px;
      border-radius: 12px;
      background: var(--accent-soft);
    }

    .prediction-class {
      font-size: clamp(1.5rem, 4vw, 2rem);
      font-weight: 800;
    }

    .confidence {
      color: var(--accent-dark);
      font-weight: 700;
    }

    .probability {
      margin: 14px 0;
    }

    .probability-label {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 6px;
      font-size: 0.9rem;
    }

    .probability-label strong {
      font-weight: 650;
    }

    .bar {
      height: 9px;
      overflow: hidden;
      border-radius: 999px;
      background: #2a3b44;
    }

    .bar-fill {
      height: 100%;
      border-radius: inherit;
      background: var(--accent);
    }

    @media (max-width: 620px) {
      main {
        width: min(100% - 20px, 540px);
        padding: 28px 0 40px;
      }

      .workspace {
        grid-template-columns: 1fr;
        gap: 20px;
      }

      .action {
        align-items: stretch;
        flex-direction: column-reverse;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">EuroSAT · AI image analysis</p>
      <h1>Satellite land cover classifier</h1>
      <p class="intro">Upload a satellite image and a small neural network trained on the EuroSAT dataset will classify it into one of ten land use categories.</p>
    </header>

    <section class="card" aria-labelledby="upload-heading">
      <h2 id="upload-heading">Choose an image</h2>
      <label class="drop-zone" id="drop-zone" for="file-input">
        <span>
          <strong>Drop an image here or browse</strong>
          JPEG, PNG, or TIFF · maximum 10 MB
        </span>
        <input id="file-input" type="file" accept=".jpg,.jpeg,.png,.tif,.tiff,image/jpeg,image/png,image/tiff">
      </label>

      <div class="workspace">
        <div class="preview-wrap" id="preview-wrap">
          <h2>Preview</h2>
          <img id="preview" alt="Selected satellite image preview">
          <p class="file-name" id="file-name"></p>
        </div>
        <div>
          <div class="action">
            <p id="status" role="status" aria-live="polite"></p>
            <button id="classify-button" type="button" disabled>Classify image</button>
          </div>
        </div>
      </div>

      <section class="results" id="results" aria-live="polite">
        <h2>Classification result</h2>
        <div class="prediction">
          <span class="prediction-class" id="predicted-class"></span>
          <span class="confidence" id="confidence"></span>
        </div>
        <div id="probabilities"></div>
      </section>
    </section>
  </main>

  <script>
    (() => {
      const ALLOWED_TYPES = new Set(["image/jpeg", "image/png", "image/tiff"]);
      const MAX_FILE_SIZE = 10 * 1024 * 1024;
      const fileInput = document.querySelector("#file-input");
      const dropZone = document.querySelector("#drop-zone");
      const previewWrap = document.querySelector("#preview-wrap");
      const preview = document.querySelector("#preview");
      const fileName = document.querySelector("#file-name");
      const classifyButton = document.querySelector("#classify-button");
      const status = document.querySelector("#status");
      const results = document.querySelector("#results");
      const predictedClass = document.querySelector("#predicted-class");
      const confidence = document.querySelector("#confidence");
      const probabilities = document.querySelector("#probabilities");
      let selectedFile = null;
      let previewUrl = null;

      function setStatus(message, isError = false) {
        status.textContent = message;
        status.classList.toggle("error", isError);
      }

      function clearResults() {
        results.classList.remove("is-visible");
        probabilities.replaceChildren();
      }

      function selectFile(file) {
        clearResults();
        if (!file) {
          selectedFile = null;
          previewWrap.classList.remove("is-visible");
          classifyButton.disabled = true;
          return;
        }

        if (!ALLOWED_TYPES.has(file.type)) {
          selectedFile = null;
          previewWrap.classList.remove("is-visible");
          classifyButton.disabled = true;
          setStatus("Invalid file type. Please choose a JPEG, PNG, or TIFF image.", true);
          return;
        }

        if (file.size > MAX_FILE_SIZE) {
          selectedFile = null;
          previewWrap.classList.remove("is-visible");
          classifyButton.disabled = true;
          setStatus("This image is too large. Please choose a file smaller than 10 MB.", true);
          return;
        }

        selectedFile = file;
        if (previewUrl) {
          URL.revokeObjectURL(previewUrl);
        }
        previewUrl = URL.createObjectURL(file);
        preview.src = previewUrl;
        fileName.textContent = file.name;
        previewWrap.classList.add("is-visible");
        classifyButton.disabled = false;
        setStatus("Ready to classify.");
      }

      function formatPercent(value) {
        return `${(value * 100).toFixed(2)}%`;
      }

      function showResults(data) {
        predictedClass.textContent = data.predicted_class;
        confidence.textContent = `${formatPercent(data.confidence)} confidence`;
        const sorted = Object.entries(data.probabilities)
          .sort(([, a], [, b]) => b - a);

        sorted.forEach(([label, value]) => {
          const row = document.createElement("div");
          row.className = "probability";
          const labelLine = document.createElement("div");
          labelLine.className = "probability-label";
          const name = document.createElement("strong");
          name.textContent = label;
          const percentage = document.createElement("span");
          percentage.textContent = formatPercent(value);
          labelLine.append(name, percentage);
          const bar = document.createElement("div");
          bar.className = "bar";
          bar.setAttribute("aria-label", `${label}: ${formatPercent(value)}`);
          const fill = document.createElement("div");
          fill.className = "bar-fill";
          fill.style.width = `${Math.max(0, Math.min(100, value * 100))}%`;
          bar.append(fill);
          row.append(labelLine, bar);
          probabilities.append(row);
        });
        results.classList.add("is-visible");
      }

      async function classify() {
        if (!selectedFile) {
          setStatus("Invalid file type. Please choose a JPEG, PNG, or TIFF image.", true);
          return;
        }

        classifyButton.disabled = true;
        clearResults();
        setStatus("Classifying image…");
        const formData = new FormData();
        formData.append("file", selectedFile);

        try {
          const response = await fetch("/predict", {
            method: "POST",
            body: formData
          });
          if (!response.ok) {
            let detail = `Request failed with HTTP ${response.status}.`;
            try {
              const errorBody = await response.json();
              if (errorBody.detail) {
                detail = `Classification failed (HTTP ${response.status}): ${errorBody.detail}`;
              }
            } catch (_) {
              // Keep the specific HTTP status when the server response is not JSON.
            }
            throw new Error(detail);
          }
          const data = await response.json();
          showResults(data);
          setStatus("Classification complete.");
        } catch (error) {
          if (error instanceof TypeError) {
            setStatus("Network error: could not connect to the classifier service.", true);
          } else {
            setStatus(error.message || "The classifier returned an unexpected response.", true);
          }
        } finally {
          classifyButton.disabled = false;
        }
      }

      fileInput.addEventListener("change", () => selectFile(fileInput.files[0]));
      classifyButton.addEventListener("click", classify);
      ["dragenter", "dragover"].forEach((eventName) => {
        dropZone.addEventListener(eventName, (event) => {
          event.preventDefault();
          dropZone.classList.add("is-dragging");
        });
      });
      ["dragleave", "drop"].forEach((eventName) => {
        dropZone.addEventListener(eventName, (event) => {
          event.preventDefault();
          dropZone.classList.remove("is-dragging");
        });
      });
      dropZone.addEventListener("drop", (event) => {
        selectFile(event.dataTransfer.files[0]);
      });
    })();
  </script>
</body>
</html>
